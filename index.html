<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>cineRoll 150.0 | Final Unlock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: {
            background: '#09090b', panel: '#18181b', border: '#27272a', coral: { 400: '#fb7185', 500: '#f43f5e', 600: '#e11d48' }
        } } } }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Inter:wght@400;500;700&family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Oswald:wght@400;700&family=Lato:wght@400;700&family=Bebas+Neue&family=Lora:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #a1a1aa; transition: background-color 0.3s; }
        .logo-font { font-family: 'Outfit', sans-serif; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }

        .tab-btn { padding: 10px 0; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #71717a; border-bottom: 2px solid transparent; transition: all 0.2s; outline: none; flex: 1; text-align: center; }
        .tab-btn:hover { color: #e4e4e7; }
        .tab-btn.active { color: #fff; border-bottom-color: #f43f5e; }

        .min-label { display: flex; justify-content: space-between; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: #71717a; margin-bottom: 6px; font-weight: 600; }
        .min-select, .min-input { width: 100%; background: transparent; border: 1px solid #27272a; color: #e4e4e7; font-size: 11px; padding: 6px 10px; border-radius: 4px; outline: none; transition: border-color 0.2s; appearance: none; }
        .min-select:focus, .min-input:focus { border-color: #52525b; }

        .min-btn { background: #18181b; border: 1px solid #27272a; color: #a1a1aa; font-size: 10px; padding: 6px 10px; border-radius: 4px; font-weight: 500; transition: all 0.15s; cursor: pointer; text-align: center; }
        .min-btn:hover { background: #27272a; border-color: #3f3f46; color: #fff; }
        .min-btn.active { background: #27272a; border-color: #f43f5e; color: #fff; }

        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; height: 16px; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 1px; background: #3f3f46; border-radius: 1px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 10px; width: 10px; border-radius: 50%; background: #e4e4e7; margin-top: -4.5px; transition: transform 0.1s, background 0.1s; }
        input[type=range]:active::-webkit-slider-thumb { background: #f43f5e; transform: scale(1.3); }

        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; cursor: text;}

        .cropper-line, .cropper-point { background-color: #f43f5e !important; }
        .cropper-view-box { outline: 1px solid #f43f5e !important; }

        #preview-area { position: absolute; inset: 0; overflow: auto; user-select: none; -webkit-user-select: none; }
        #preview-area-inner { display: grid; place-items: center; min-width: 100%; min-height: 100%; padding: 2rem 1rem 8rem 1rem; transition: padding 0.3s ease; user-select: none; }
        @media (min-width: 768px) { #preview-area-inner { padding: 4rem 2rem; } }
        body.zen-mode #preview-area-inner { padding: 1rem !important; }

        #preview-wrapper-parent { position: relative; flex-shrink: 0; box-shadow: 0 40px 100px rgba(0,0,0,0.95); margin: auto; }
        .preview-layer { display: flex; width: 100%; height: 100%; position: absolute; inset: 0; pointer-events: none; }

        .layer-glass { z-index: 50; pointer-events: none; }
        .layer-glass > div { pointer-events: auto; }

        .preview-img { image-rendering: high-quality; image-rendering: -webkit-optimize-contrast; transition: filter 0.2s; display: block; width: 100%; height: 100%; object-fit: cover;}
        .border-vnotch { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 60%, 1.8% 57.5%, 0 55%, 0 51%, 1.8% 48.5%, 0 46%); }
        .slide-container { position: relative; overflow: hidden; transition: background-color 0.1s; }
        .gallery-grain-overlay { mix-blend-mode: overlay; pointer-events: none; z-index: 10; position: absolute; inset: 0; }

        .draggable-text, .draggable-logo { position: absolute; cursor: grab; z-index: 9999; transform: translate(-50%, -50%); padding: 12px; outline: none; border: none; white-space: nowrap; display: flex; align-items: center; justify-content: center; pointer-events: auto !important; background: rgba(0,0,0,0.01); flex-shrink: 0 !important; }
        .draggable-logo img { pointer-events: none; display: block; flex-shrink: 0 !important; max-width: none !important; }
        .draggable-text:active, .draggable-logo:active { cursor: grabbing; }
        .is-active-target { outline: 1px dashed rgba(244,63,94,0.6); outline-offset: 2px; }

        .snap-guide { position: absolute; background-color: #f43f5e; z-index: 40; pointer-events: none; display: none; }
        .snap-guide-x { left: 0; right: 0; height: 1px; }
        .snap-guide-y { top: 0; bottom: 0; width: 1px; }
        .disabled-block { display: none !important; }

        input[type="color"] { flex-shrink: 0; -webkit-appearance: none; border: none; width: 18px; height: 18px; border-radius: 50%; cursor: pointer; padding: 0; background: transparent; outline: 1px solid #52525b; outline-offset: 2px; transition: transform 0.1s;}
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

        .style-btn { transition: all 0.1s; }
        .style-btn.active { background: rgba(244, 63, 94, 0.2); color: #fca5a5; border-color: #f43f5e; }

        .preset-chip { background: #18181b; border: 1px solid #27272a; border-radius: 4px; font-size: 9px; color: #a1a1aa; display: flex; align-items: center; overflow: hidden; transition: all 0.2s; cursor: pointer; margin-bottom: 4px; font-weight: 500;}
        .preset-chip:hover { border-color: #3f3f46; color: #fff; }
        .preset-chip .chip-name { padding: 5px 8px; flex: 1; }
        .preset-chip .chip-del { padding: 5px 6px; background: #09090b; color: #71717a; transition: background 0.2s, color 0.2s; }
        .preset-chip .chip-del:hover { background: #f43f5e; color: #fff; }

        .preset-pill { background: transparent; border: 1px solid #27272a; padding: 4px 8px; border-radius: 4px; font-size: 8px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: all 0.2s; color: #71717a; letter-spacing: 0.05em; }
        .preset-pill:hover { border-color: #52525b; color: #fff; }
        .preset-pill.active { background: #f43f5e; border-color: #f43f5e; color: #fff; }
        .text-preset-gold { background-image: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        .text-preset-silver { background-image: linear-gradient(135deg, #8A9097 0%, #E0E5EC 25%, #8A9097 50%, #B0B5BB 75%, #595F66 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }

        body.zen-mode header, body.zen-mode aside { display: none !important; }
        body.zen-mode #main-stage { background-color: #000000 !important; }
        body.zen-mode #zoom-controls { display: none !important; }

        #export-modal { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        #export-modal.show { opacity: 1; pointer-events: auto; }
        .export-img-item { box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-width: 100%; height: auto; border-radius: 2px; }
    </style>
</head>
<body class="fixed inset-0 w-full h-[100dvh] flex flex-col overflow-hidden overscroll-none bg-background">

    <div style="position: absolute; width: 0; height: 0; overflow: hidden; visibility: hidden; pointer-events: none; z-index: -1;">
        <span style="font-family: 'Inter'; font-weight: 400;">preload</span>
        <span style="font-family: 'Outfit'; font-weight: 700;">preload</span>
    </div>

    <div id="export-modal" class="fixed inset-0 z-[99999] bg-[#000000] flex flex-col">
        <div class="h-16 px-6 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent absolute top-0 left-0 w-full z-10">
            <div class="text-white text-xs font-bold uppercase tracking-widest">Output Gallery</div>
            <button onclick="closeExportModal()" class="text-white/70 hover:text-white p-2 text-xl font-bold">✕</button>
        </div>
        <div class="flex-1 overflow-y-auto pt-20 pb-28 px-6 flex flex-col items-center gap-8" id="export-gallery-container"></div>
        <div class="h-28 flex flex-col items-center justify-center bg-gradient-to-t from-black/95 to-transparent absolute bottom-0 left-0 w-full pointer-events-none">
            <span class="text-coral-400 font-bold text-[9px] uppercase tracking-widest bg-black/50 px-4 py-1.5 rounded-full backdrop-blur-md mb-3">
                Right-Click or Long Press to Save
            </span>
            <button onclick="closeExportModal()" class="text-white text-[11px] uppercase font-bold tracking-widest bg-coral-600 hover:bg-coral-500 px-8 py-3 rounded-full pointer-events-auto transition-colors shadow-2xl border border-coral-400 active:scale-95">
                RETURN TO WORKSPACE
            </button>
        </div>
    </div>

    <button id="btn-exit-zen" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 z-[99999] bg-zinc-800/90 hover:bg-coral-500 text-white px-6 py-3 rounded-full transition-opacity duration-500 backdrop-blur-md items-center justify-center shadow-2xl font-bold text-[10px] uppercase tracking-widest hidden opacity-0" onclick="toggleZenMode()">
        Exit Zen Mode
    </button>

    <div id="loading-overlay" class="fixed inset-0 z-[999999] bg-black/90 hidden flex-col items-center justify-center transition-opacity duration-300">
        <div id="loading-text" class="text-white text-xs md:text-sm font-bold uppercase tracking-widest mb-6 font-mono transition-all duration-300 text-center">Processing Cinematic Core...</div>
        <div class="w-48 h-1 bg-zinc-800 rounded overflow-hidden"><div class="w-full h-full bg-coral-500 animate-pulse"></div></div>
    </div>

    <header class="h-12 border-b border-border bg-panel flex items-center justify-between px-4 shrink-0 z-30 relative">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <h1 class="logo-font text-lg font-bold tracking-tight text-white">cine<span class="text-coral-500">Roll</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 border-r border-border pr-3 mr-1">
                <button id="btn-zen-mode" style="display: none;" class="items-center justify-center w-7 h-7 bg-background text-zinc-400 hover:text-white rounded border border-border transition-colors cursor-pointer" onclick="toggleZenMode()" title="Zen Mode (F)">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                </button>
                <button id="btn-split-view" style="display: none;" class="items-center justify-center w-7 h-7 bg-background text-zinc-400 hover:text-white rounded border border-border transition-colors cursor-pointer" onclick="toggleSplitView()" title="Split View (Before & After)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="12" y1="3" x2="12" y2="21" /><rect x="12" y="3" width="9" height="18" fill="currentColor" opacity="0.3" /></svg>
                </button>
            </div>
            <button onclick="location.reload()" class="flex md:flex items-center gap-1.5 text-[9px] font-bold text-zinc-400 hover:text-white bg-background px-3 py-1.5 rounded border border-border transition-colors">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span class="hidden sm:inline">NEW PHOTO</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row overflow-hidden w-full relative">
        <main id="main-stage" class="w-full h-[40%] md:h-full md:flex-1 relative flex bg-background overflow-hidden select-none transition-colors duration-300 shrink-0">
            <div id="upload-zone" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-background transition-opacity duration-300">
                <label class="relative w-[240px] md:w-[280px] h-[140px] md:h-[160px] border border-dashed border-zinc-800 rounded-xl flex flex-col items-center justify-center text-zinc-500 hover:border-coral-500 hover:text-coral-400 transition-colors bg-[#111] cursor-pointer">
                    <input type="file" id="upload-input" accept="image/*,.tif,.tiff" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <svg class="w-6 h-6 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span id="uploadText" class="text-[10px] font-bold tracking-widest uppercase">Import Resource</span>
                    <span class="text-[8px] mt-2 opacity-50 tracking-wider">JPEG, PNG, TIFF, RAW(OS)</span>
                </label>
            </div>

            <div id="smart-snap-badge" class="absolute transform -translate-x-1/2 bg-green-500 text-black px-4 py-1.5 rounded-full font-bold text-[10px] uppercase tracking-wider opacity-0 transition-all duration-100 z-50 pointer-events-none shadow-[0_0_20px_rgba(34,197,94,0.5)]"></div>

            <div id="zoom-controls" class="hidden absolute bottom-4 md:bottom-6 left-1/2 transform -translate-x-1/2 z-[60] bg-[#111]/80 backdrop-blur-xl px-4 py-2 rounded-full border border-white/5 shadow-2xl items-center gap-3 transition-opacity duration-300">
                <button class="text-[9px] font-bold text-coral-400 hover:text-white uppercase tracking-widest px-1 outline-none" onclick="setZoom('fit')">FIT</button>
                <input type="range" id="slider-zoom" min="20" max="400" value="100" class="w-20 md:w-28 h-1 bg-zinc-800 rounded-full appearance-none outline-none">
                <div class="flex items-center w-12 justify-end"><input type="number" id="in-zoom" class="bg-transparent text-right outline-none w-full text-white font-mono text-[10px]" value="100"><span class="text-[9px] text-zinc-500 ml-0.5">%</span></div>
            </div>

            <div id="image-container" class="absolute inset-0 z-10 w-full h-full hidden opacity-0 transition-opacity duration-300"></div>
            <div id="preview-area" class="hidden z-20 w-full h-full"><div id="preview-area-inner"></div></div>
        </main>

        <aside class="w-full flex-1 md:flex-none md:w-[300px] md:h-full bg-panel border-t md:border-t-0 md:border-l border-border flex flex-col shrink-0 z-40 relative select-none overflow-hidden">
            <nav class="flex border-b border-border shrink-0 bg-panel px-1">
                <button class="tab-btn active" onclick="switchTab('format')">Format</button>
                <button class="tab-btn" onclick="switchTab('frame')">Frame</button>
                <button class="tab-btn" onclick="switchTab('tone')">Tone</button>
                <button class="tab-btn" onclick="switchTab('color')">Color</button>
                <button class="tab-btn" onclick="switchTab('typo')">Typo</button>
            </nav>

            <div class="flex-1 overflow-y-auto custom-scroll p-4 md:p-5 overscroll-contain">
                <div id="tab-format" class="tab-content space-y-5">
                    <div>
                        <label class="min-label"><span>Strategy</span></label>
                        <div class="grid grid-cols-3 gap-1.5" id="strategy-btns">
                            <button class="min-btn active" data-val="seamless">Seamless</button>
                            <button class="min-btn" data-val="triptych">Triptych</button>
                            <button class="min-btn" data-val="single">Single</button>
                        </div>
                    </div>

                    <div id="ratio-wrapper">
                        <div class="flex justify-between items-center mb-1.5"><label class="min-label mb-0"><span>Base Ratio</span></label><button class="text-[9px] text-zinc-500 hover:text-white" onclick="resetFraming()">↺</button></div>
                        <select class="min-select" id="select-ratio">
                            <option value="NaN">Free (Smart Snap)</option>
                            <option value="1">1:1 (Square)</option>
                            <option value="0.8" selected>4:5 (Vertical IG)</option>
                            <option value="0.75">3:4 (Classic Portrait)</option>
                            <option value="0.666">2:3 (35mm Vertical)</option>
                            <option value="1.5">3:2 (35mm Horizontal)</option>
                            <option value="1.777">16:9 (Landscape)</option>
                        </select>
                    </div>

                    <div id="seamless-count-wrapper">
                        <label class="min-label mb-1.5"><span>Pan Slides</span></label>
                        <select class="min-select" id="select-slides"><option value="2">2 Slides</option><option value="3" selected>3 Slides</option><option value="4">4 Slides</option></select>
                    </div>

                    <div class="pt-3 border-t border-border">
                        <label class="min-label mb-1.5"><span>De-squeeze</span></label>
                        <select class="min-select" id="select-squeeze">
                            <option value="100" selected>1.0x (Standard)</option>
                            <option value="133">1.33x</option>
                            <option value="150">1.50x</option>
                            <option value="160">1.60x (Sirui)</option>
                            <option value="180">1.80x</option>
                            <option value="200">2.00x</option>
                        </select>
                    </div>

                    <div class="pt-3 border-t border-border">
                        <label class="min-label mb-1.5"><span>Rotate & Straighten</span></label>
                        <button class="w-full bg-background border border-border hover:border-coral-500 text-zinc-400 hover:text-white py-1.5 rounded transition-colors text-[10px] font-bold mb-2 flex items-center justify-center gap-1" onclick="rotateBase(90)">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg> Rotate 90°
                        </button>
                        <div class="flex items-center gap-2">
                            <input type="range" id="slider-angle" min="-45" max="45" value="0" step="0.5" class="flex-1">
                            <div class="flex items-center"><input type="number" id="in-angle" class="bg-transparent text-right outline-none w-8 text-white text-[10px] font-mono" value="0"><span>°</span></div>
                        </div>
                    </div>

                    <button class="w-full text-[10px] font-bold text-white bg-transparent border border-coral-500 hover:bg-coral-500/20 py-2.5 rounded mt-2 transition-colors uppercase tracking-widest" onclick="applyCropAndRender()">
                        Apply Crop
                    </button>
                </div>

                <div id="tab-frame" class="tab-content space-y-5 hidden">
                    <div>
                        <label class="min-label mb-1.5"><span>Paper Texture</span></label>
                        <div class="grid grid-cols-2 gap-1.5 mb-1.5"><button class="min-btn active" data-bg="#000000" onclick="setBG(this)">Pure Black</button><button class="min-btn" data-bg="#ffffff" onclick="setBG(this)">Pure White</button></div>
                        <div class="grid grid-cols-2 gap-1.5"><button class="min-btn" data-bg="#141414" onclick="setBG(this)">Archival Blk</button><button class="min-btn" data-bg="#F4F0E6" onclick="setBG(this)">Baryta Wht</button></div>
                    </div>
                    <div class="pt-3 border-t border-border">
                        <label class="min-label mb-1.5"><span>Layout</span></label>
                        <div class="grid grid-cols-2 gap-1.5"><button class="min-btn active" id="btn-edge" onclick="setMargin(false)">Edge-to-Edge</button><button class="min-btn" id="btn-margin" onclick="setMargin(true)">Margin Frame</button></div>
                    </div>
                    <div id="margin-scale-wrapper" class="pt-3 border-t border-border hidden">
                        <label class="min-label mb-1.5"><span>Padding</span><div class="flex items-center"><input type="number" id="in-margin-scale" class="bg-transparent text-right outline-none w-8 text-white font-mono hover:bg-[#222] px-1 rounded" value="85"><span>%</span></div></label>
                        <input type="range" id="slider-margin-scale" min="50" max="100" value="85" oninput="ModuleFrame.build()">

                        <div class="mt-4 border-t border-border pt-3">
                            <label class="min-label mb-1.5"><span class="text-coral-400">Film Borders</span></label>
                            <select id="select-border" class="min-select" onchange="ModuleFrame.updateBorderOptions()"><option value="none">None (Clean)</option><option value="fineart">Fine-Art Line</option><option value="vnotch">120mm V-Notch</option><option value="instant">Type-100</option></select>
                            <div id="border-weight-wrapper" class="mt-2 hidden">
                                <label class="min-label mb-1"><span>Weight</span><div class="flex items-center"><input type="number" id="in-borderWeight" class="bg-transparent text-right outline-none w-8 text-white font-mono hover:bg-[#222] px-1 rounded" value="3"></div></label>
                                <input type="range" id="slider-borderWeight" min="1" max="10" value="3" step="0.5" oninput="ModuleFrame.build()">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-tone" class="tab-content space-y-5 hidden">
                    <div class="pb-3 border-b border-border mb-3">
                        <div class="flex justify-between items-center mb-2">
                            <label class="min-label mb-0"><span class="text-coral-400">Cinematic LUT</span></label>
                            <button onclick="document.getElementById('uploadLut').click()" class="text-[9px] text-zinc-400 hover:text-white flex items-center gap-1 font-bold"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> .CUBE</button>

    <script>
        const DOM = {

            sSh: document.getElementById('slider-sh'), inSh: document.getElementById('in-sh'),
            wmText: document.getElementById('watermarkText'), fontSel: document.getElementById('fontSelect'), textColor: document.getElementById('textColorPicker'),
            wmTarget: document.getElementById('watermarkTarget'),
            sGlowAmt: document.getElementById('slider-glow-amount'), sFontScale: document.getElementById('slider-fontScale'), inFontScale: document.getElementById('in-fontScale'),
            upLogo: document.getElementById('uploadLogo'), logoSettings: document.getElementById('logoSettings'), logoStatus: document.getElementById('logoStatus'), toggleLogo: document.getElementById('toggle-logo'),
            sLogoScale: document.getElementById('sliderLogoScale'), inLogoScale: document.getElementById('in-logoScale'),
            sLogoOp: document.getElementById('sliderLogoOp'), inLogoOp: document.getElementById('in-logoOp'),
            btnExport: document.getElementById('btn-export'), badge: document.getElementById('smart-snap-badge'),
            zoomControls: document.getElementById('zoom-controls'), sliderZoom: document.getElementById('slider-zoom'), inZoom: document.getElementById('in-zoom'),
            marginScaleWrapper: document.getElementById('margin-scale-wrapper'), sMarginScale: document.getElementById('slider-margin-scale'), inMarginScale: document.getElementById('in-margin-scale'),
            sBorder: document.getElementById('select-border'), sBorderWeight: document.getElementById('slider-borderWeight'), inBorderWeight: document.getElementById('in-borderWeight'), borderWeightWrapper: document.getElementById('border-weight-wrapper'),
            exportQuality: document.getElementById('exportQuality'),
            ratioWrapper: document.getElementById('ratio-wrapper'), seamlessWrapper: document.getElementById('seamless-count-wrapper'),
            toggleAppLogo: document.getElementById('toggleAppLogo'), presetList: document.getElementById('custom-presets-container')
        };

        let cropper = null; let originalImg = null; let rawFile = null; let currentStrategy = 'seamless';
        let baseProxyCropUrl = null; let proxyCropUrl = null;

        let isBold = false; let isGlow = true; let manualBackupText = "";
        let tPosX = 50, tPosY = 94, lPosX = 50, lPosY = 80; let logoObj = null; let logoUrl = null; let activeTarget = null;
        let isCropperReady = false; let isSplitView = false; let splitPos = 50;
        let textStylePreset = 'none'; let savedCustomPresets = []; let lutStyleStr = 'none'; let baseRotation = 0;

        function initGrain() {
            const c = document.createElement('canvas'); c.width = 256; c.height = 256; const ctx = c.getContext('2d'); const id = ctx.createImageData(256, 256);
            for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() < 0.5 ? 0 : 255; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 40; }
            ctx.putImageData(id, 0, 0); staticGrainDataUrl = c.toDataURL('image/png');
        }
        initGrain();

        window.addEventListener('DOMContentLoaded', () => {
            loadPresetsFromStorage();
            initGlobalDrag();
        });

        function loadPresetsFromStorage() {
            const stored = localStorage.getItem('cineroll_presets_v4');
            if (stored) { try { savedCustomPresets = JSON.parse(stored); renderPresetChips(); } catch(e) {} }
        }

        function applyZoom() {
            const parentWrap = document.getElementById('preview-wrapper-parent');
            if(!parentWrap) return;
            const isMobile = window.innerWidth < 768;
            const padX = isMobile ? 32 : 64; let padY = isMobile ? 120 : 128;
            const parentW = DOM.previewArea.clientWidth - padX; const parentH = DOM.previewArea.clientHeight - padY;
            if (parentW <= 0 || parentH <= 0) return;

            if (zoomMode === 'fit') {
                let targetH = Math.min(parentH, parentW / activeGlobalRatio);
                parentWrap.style.height = targetH + 'px'; parentWrap.style.width = (targetH * activeGlobalRatio) + 'px';
                DOM.inZoom.value = 100; DOM.sliderZoom.value = 100;
            } else {
                let baseHeightForZoom = Math.min(parentH, parentW / activeGlobalRatio);
                let zoomedH = baseHeightForZoom * (DOM.sliderZoom.value / 100);
                parentWrap.style.height = zoomedH + 'px'; parentWrap.style.width = (zoomedH * activeGlobalRatio) + 'px';
                DOM.inZoom.value = DOM.sliderZoom.value;
            }
            ModuleTypo.update();
        }

        window.setZoom = function(mode) { zoomMode = mode; if(mode === 'fit') { DOM.sliderZoom.value = 100; DOM.inZoom.value = 100; } applyZoom(); }
        window.addEventListener('resize', () => { if(zoomMode === 'fit') applyZoom(); });

        DOM.sliderZoom.addEventListener('input', (e) => { zoomMode = 'custom'; DOM.inZoom.value = e.target.value; applyZoom(); });
        DOM.sliderZoom.addEventListener('touchmove', (e) => { zoomMode = 'custom'; DOM.inZoom.value = e.target.value; applyZoom(); }, {passive: true});
        DOM.inZoom.addEventListener('change', (e) => { zoomMode = 'custom'; DOM.sliderZoom.value = e.target.value; applyZoom(); });

        function bindInputSlider(slider, input, callback, isTone = false) {
            if(!slider || !input) return;
            slider.addEventListener('input', (e) => { input.value = e.target.value; if(!isTone && callback) callback(); });
            if(isTone) { slider.addEventListener('change', e => { if(callback) callback(); }); }
            input.addEventListener('change', (e) => {
                let val = parseFloat(e.target.value);
                if(val < parseFloat(slider.min)) val = slider.min;
                if(val > parseFloat(slider.max)) val = slider.max;
                e.target.value = val; slider.value = val;
                if(callback) callback();
            });
        }

        bindInputSlider(DOM.sAngle, DOM.inAngle, () => { if(cropper) cropper.rotateTo(DOM.sAngle.value); });
        bindInputSlider(DOM.sBr, DOM.inBr, () => ModuleColor.updateCSSFilters());
        bindInputSlider(DOM.sCo, DOM.inCo, () => ModuleColor.updateCSSFilters());
        bindInputSlider(DOM.sSa, DOM.inSa, () => ModuleColor.updateCSSFilters());
        bindInputSlider(DOM.sGrain, DOM.inGrain, () => ModuleColor.updateCSSFilters());
        bindInputSlider(DOM.sHl, DOM.inHl, () => ModuleColor.triggerEngine(), true);
        bindInputSlider(DOM.sSh, DOM.inSh, () => ModuleColor.triggerEngine(), true);
        bindInputSlider(DOM.sLogoScale, DOM.inLogoScale, () => ModuleTypo.update());
        bindInputSlider(DOM.sLogoOp, DOM.inLogoOp, () => ModuleTypo.update());
        bindInputSlider(DOM.sMarginScale, DOM.inMarginScale, () => ModuleFrame.build());
        bindInputSlider(DOM.sFontScale, DOM.inFontScale, () => ModuleTypo.update());
        bindInputSlider(DOM.sBorderWeight, DOM.inBorderWeight, () => ModuleFrame.build());

        window.toggleSplitView = () => {
            isSplitView = !isSplitView;
            DOM.btnBA.classList.toggle('bg-zinc-800', isSplitView);
            DOM.btnBA.classList.toggle('text-white', isSplitView);
            ModuleFrame.build();
        };

        window.toggleZenMode = () => {
            if(!proxyCropUrl) return;
            document.body.classList.toggle('zen-mode');
            const isZen = document.body.classList.contains('zen-mode');
            const exitBtn = document.getElementById('btn-exit-zen');
            if (exitBtn) {
                if (isZen) {
                    exitBtn.classList.remove('hidden'); exitBtn.classList.add('flex');
                    exitBtn.classList.remove('opacity-0'); exitBtn.classList.add('opacity-100');
                    clearTimeout(window.zenTimeout);
                    window.zenTimeout = setTimeout(() => { exitBtn.classList.remove('opacity-100'); exitBtn.classList.add('opacity-0'); }, 2000);
                }
                else {
                    exitBtn.classList.add('hidden'); exitBtn.classList.remove('flex');
                }
            }
            setTimeout(() => applyZoom(), 100);
        };

        window.addEventListener('mousemove', () => {
            if(document.body.classList.contains('zen-mode')) {
                const btn = document.getElementById('btn-exit-zen');
                if(btn) {
                    btn.classList.remove('opacity-0');
                    btn.classList.add('opacity-100');
                    clearTimeout(window.zenTimeout);
                    window.zenTimeout = setTimeout(() => {
                        btn.classList.remove('opacity-100');
                        btn.classList.add('opacity-0');
                    }, 2000);
                }
            }
        });

        let isDraggingSplit = false;
        window.addEventListener('mousemove', (e) => {
            if(!isDraggingSplit || !isSplitView) return;
            e.preventDefault();
            const parentWrapper = document.getElementById('preview-wrapper-parent');
            const layerImagesBefore = document.getElementById('layer-images-before');
            const handle = document.getElementById('split-handle');
            if(!parentWrapper || !layerImagesBefore || !handle) return;

            const rect = parentWrapper.getBoundingClientRect();
            let pct = ((e.clientX - rect.left) / rect.width) * 100;
            pct = Math.max(0, Math.min(100, pct));
            splitPos = pct;
            layerImagesBefore.style.clipPath = `polygon(0 0, ${pct}% 0, ${pct}% 100%, 0 100%)`;
            handle.style.left = `${pct}%`;
        });
        window.addEventListener('mouseup', () => { isDraggingSplit = false; });

        document.addEventListener('keydown', (e) => {
            const isInput = ['INPUT', 'TEXTAREA'].includes(e.target.tagName);
            if(e.key.toLowerCase() === 'f' && !isInput) { e.preventDefault(); toggleZenMode(); }
            if(e.key === 'Escape' && document.body.classList.contains('zen-mode')) { toggleZenMode(); }
            if(e.key === 'Enter' && !isInput && e.target.tagName !== 'BUTTON') {
                const formatTab = document.getElementById('tab-format');
                if(formatTab && !formatTab.classList.contains('hidden') && cropper && isCropperReady) {
                    e.preventDefault(); applyCropAndRender();
                }
            }
            if(activeTarget && !isInput) {
                const step = 0.5; let moved = false;
                if(e.key === 'ArrowUp') { if(activeTarget==='text') tPosY-=step; else lPosY-=step; moved=true; }
                if(e.key === 'ArrowDown') { if(activeTarget==='text') tPosY+=step; else lPosY+=step; moved=true; }
                if(e.key === 'ArrowLeft') { if(activeTarget==='text') tPosX-=step; else lPosX-=step; moved=true; }
                if(e.key === 'ArrowRight') { if(activeTarget==='text') tPosX+=step; else lPosX+=step; moved=true; }
                if(moved) { e.preventDefault(); ModuleTypo.updatePositions(); }
            }
        });

        const DragState = { active: false, target: null, container: null, gx: null, gy: null };

        function initGlobalDrag() {
            function startDrag(e, type, el) {
                DragState.active = true; DragState.target = type; activeTarget = type;
                DragState.container = el.parentElement;
                if(DragState.container) { DragState.gx = DragState.container.querySelector('.snap-guide-x'); DragState.gy = DragState.container.querySelector('.snap-guide-y'); }

                document.querySelectorAll('.draggable-text, .draggable-logo').forEach(n => n.classList.remove('is-active-target'));
                el.classList.add('is-active-target');
                el.focus();
            }

            window.addEventListener('mousedown', e => {
                let te = e.target.closest('.draggable-text'); let le = e.target.closest('.draggable-logo');
                if(te) { startDrag(e, 'text', te); }
                else if(le) { startDrag(e, 'logo', le); }
                else if(e.target.closest('#preview-wrapper-parent')) {
                    activeTarget = null;
                    document.querySelectorAll('.draggable-text, .draggable-logo').forEach(n => n.classList.remove('is-active-target'));
                }
            });

            window.addEventListener('touchstart', e => {
                let te = e.target.closest('.draggable-text'); let le = e.target.closest('.draggable-logo');
                if(te) startDrag(e, 'text', te); else if(le) startDrag(e, 'logo', le);
            }, {passive: false});

            function moveDrag(e) {
                if(!DragState.active || !DragState.container) return;
                e.preventDefault();
                const rect = DragState.container.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                let px = ((clientX - rect.left)/rect.width)*100;
                let py = ((clientY - rect.top)/rect.height)*100;
                px = Math.max(0, Math.min(100, px)); py = Math.max(0, Math.min(100, py));
                const snap = 2.5; let sx = false, sy = false;
                if(Math.abs(px-50)<snap) { px=50; sx=true; }
                if(Math.abs(py-50)<snap) { py=50; sy=true; }
                if(Math.abs(py-94)<snap) { py=94; sy=true; }

                if(DragState.target==='text') { tPosX=px; tPosY=py; } else { lPosX=px; lPosY=py; }
                ModuleTypo.updatePositions();

                if(DragState.gx) { DragState.gx.style.display = sy?'block':'none'; DragState.gx.style.top = `${py}%`; }
                if(DragState.gy) { DragState.gy.style.display = sx?'block':'none'; DragState.gy.style.left = `${px}%`; }
            }

            } catch (err) { hideLoading(); alert("Export Failed: " + err.message); DOM.btnExport.innerText = "❌ Failed"; } finally { DOM.btnExport.classList.remove('opacity-70', 'pointer-events-none'); setTimeout(() => { DOM.btnExport.innerText = "Export Gallery"; }, 3000); }
        });
    </script>
</body>
</html>
